{% extends 'requestsystem/base.html' %}
{% load static %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, var(--bg-light) 0%, #e2e8f0 100%);
    min-height: 100vh;
  }
  
  .login-container {
    max-width: 420px;
    margin: 30px auto;
    padding: 0 15px;
  }

  .login-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(26, 54, 93, 0.15);
    overflow: hidden;
  }

  .login-header {
    background: linear-gradient(135deg, var(--primary-navy) 0%, #0f2443 100%);
    color: white;
    padding: 25px 20px;
    text-align: center;
  }

  .login-logo {
    width: 75px;
    height: 75px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }

  .login-logo img {
    max-width: 50px;
    max-height: 50px;
  }

  .login-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .login-subtitle {
    font-size: 13px;
    opacity: 0.9;
    font-weight: 400;
  }

  .login-body {
    padding: 25px 25px;
  }

  .form-floating {
    margin-bottom: 12px;
  }

  /* Container wrapper para sa password toggle */
  .password-wrapper {
    position: relative;
  }

  .form-control {
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  /* Hatagan og space ang right side aron dili mag-overlap ang text ug icon */
  .password-wrapper .form-control {
    padding-right: 42px;
  }

  .form-control:focus {
    border-color: var(--primary-navy);
    box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.08);
  }

  .form-label {
    color: var(--text-dark);
    font-weight: 500;
  }

  /* Style sa Toggle Password Icon */
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #64748b;
    cursor: pointer;
    z-index: 10;
    padding: 4px;
    font-size: 15px;
    transition: color 0.2s ease;
  }

  .toggle-password:hover {
    color: var(--primary-navy);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary-navy) 0%, var(--primary-light) 100%);
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(26, 54, 93, 0.2);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(26, 54, 93, 0.25);
  }

  .alert {
    border-radius: 10px;
    border: none;
    padding: 10px 15px;
    font-size: 13px;
  }

  .forgot-link {
    color: var(--primary-navy);
    text-decoration: none;
    font-weight: 500;
    font-size: 13px;
    transition: color 0.2s;
  }

  .forgot-link:hover {
    color: var(--primary-gold);
    text-decoration: underline;
  }

  .signup-text {
    font-size: 13px;
    color: var(--text-dark);
  }

  .signup-link {
    color: var(--primary-navy);
    font-weight: 700;
    text-decoration: none;
    transition: color 0.2s;
  }

  .signup-link:hover {
    color: var(--primary-gold);
    text-decoration: underline;
  }
</style>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <img src="{% static 'images/cc.png' %}" alt="School Logo">
      </div>
      <h1 class="login-title">DocQuest</h1>
      <p class="login-subtitle">School Registrar Document Request System</p>
    </div>

    <div class="login-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show text-center mb-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="floatingUsername" name="username" placeholder="Username" required>
          <label for="floatingUsername">Username</label>
        </div>
        
        <div class="form-floating mb-2 password-wrapper">
          <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required>
          <label for="floatingPassword">Password</label>
          <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="toggleIcon"></i>
          </button>
        </div>

        <div class="d-flex justify-content-end mb-3">
          <a href="{% url 'password_reset' %}" class="forgot-link">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-sign-in-alt me-2"></i> Login
        </button>
      </form>

      <div class="text-center mt-3">
        <p class="signup-text mb-0">
          Don't have an account? 
          <a href="{% url 'register' %}" class="signup-link">Sign Up</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const togglePasswordBtn = document.getElementById('togglePasswordBtn');
  const passwordInput = document.getElementById('floatingPassword');
  const toggleIcon = document.getElementById('toggleIcon');

  togglePasswordBtn.addEventListener('click', function() {
    // Switch between 'password' and 'text'
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    
    // Switch FontAwesome eye icon (fa-eye <-> fa-eye-slash)
    toggleIcon.classList.toggle('fa-eye');
    toggleIcon.classList.toggle('fa-eye-slash');
  });
});
</script>
{% endblock %}
